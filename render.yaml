services:
  - type: web
    name: campusconnect-api
    runtime: node
    buildCommand: npm ci && npm run db:generate && npm run build
    preDeployCommand: npm run db:deploy
    startCommand: npm run start --workspace server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
